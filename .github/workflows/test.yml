name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            tags: ""
          - arch: amd64
            runner: ubuntu-latest
            tags: purego
          - arch: arm64
            runner: ubuntu-24.04-arm
            tags: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            tags: purego
    name: Test on ${{ matrix.arch }}${{ matrix.tags && format(' ({0})', matrix.tags) || '' }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: |
          go test -v -tags=${{ matrix.tags }} ./...
          cd examples && go test -v

  # Test the experimental simd/archsimd code paths on linux/amd64 at the
  # GOAMD64 microarchitecture levels they are intended to be used with.
  simd:
    strategy:
      matrix:
        goamd64:
          - v3
          - v4

    name: Test GOEXPERIMENT=simd (GOAMD64=${{ matrix.goamd64 }})
    runs-on: ubuntu-latest

    env:
      GOEXPERIMENT: simd
      GOAMD64: ${{ matrix.goamd64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # simd/archsimd requires Go 1.26; its API has breaking changes in
          # later releases.
          go-version: 1.26.x

      # GitHub amd64 runners are a mix of CPUs with and without AVX-512;
      # GOAMD64=v4 binaries fail at startup on the latter, so skip the run
      # when the runner cannot execute it.
      - name: Check CPU features
        id: cpu
        run: |
          if [ "${{ matrix.goamd64 }}" = "v4" ] && ! grep -q avx512bw /proc/cpuinfo; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "runner CPU does not support AVX-512, skipping GOAMD64=v4"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.cpu.outputs.supported == 'true'
        run: |
          go test -v ./...
          cd examples && go test -v

      # The archsimd code is pure Go, so it is also the implementation used
      # when building with -tags=purego under GOEXPERIMENT=simd.
      - name: Run tests with purego
        if: steps.cpu.outputs.supported == 'true'
        run: go test -v -tags=purego ./...
